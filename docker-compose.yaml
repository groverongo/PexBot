services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        CONDA_ENV_NAME: PexBot-api
    ports:
      - "8000:8000"
    env_file: ./api/.env
    networks:
      - default
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    networks:
      - default
    
networks:
  default:
    name: pexbot-network
    driver: bridge