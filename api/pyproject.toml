[project]
name = "api"
version = "0.1.0"
description = ""
authors = [
    {name = "groverongo",email = "ugartegrover@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard] (>=0.115.6,<0.116.0)",
    "transformers[torch] (>=4.48.1,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poe.tasks]
start = "fastapi run src/main.py"
"start:dev" = "fastapi dev src/main.py"